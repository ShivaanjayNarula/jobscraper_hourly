name: hunt

on:
  schedule:
    # Every 20 minutes, and that is NOT because the job needs to run that often
    # — it is because GitHub's scheduler is best-effort and silently drops runs.
    #
    # Measured over 30 consecutive runs on an hourly ('17 * * * *') schedule:
    # median gap 58 min, but 9 of 29 gaps exceeded 70 min and the worst was
    # 274 min. A cron asking for hourly delivered a 4.5-hour hole. Actual job
    # runtime was 4-8 min throughout, so this was never a capacity problem —
    # the schedule simply did not fire.
    #
    # Asking every 20 min means a dropped run costs 20 min instead of an hour,
    # and two consecutive drops still land inside the 1-hour freshness target.
    # Overlap is handled by the `concurrency` block below (queues, never
    # cancels), and public-repo Actions minutes are free, so the only real cost
    # is more 'board list update' commits.
    #
    # Before lengthening this again: check real run durations first. The last
    # schedule change was made on an unmeasured hunch and had to be reverted.
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a test email containing everything that currently matches'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # State lives in the Actions cache between runs, not in a commit. Committing
      # it hourly would add a full copy of the file to git history 24 times a day.
      # The committed snapshot below is the durable backup if a cache is evicted.
      - name: Restore seen state
        uses: actions/cache/restore@v4
        with:
          path: state/seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      # Tiny (one boolean per ATS) — only exists so outage_started/outage_recovered
      # below fire on transitions, not on every run of an ongoing outage.
      - name: Restore outage state
        uses: actions/cache/restore@v4
        with:
          path: state/outage.json
          key: outage-${{ github.run_id }}
          restore-keys: outage-

      - run: npm install --no-audit --no-fund

      # Only Google and Meta need a real browser; everything else is a JSON call.
      # The download is ~115 MB, so it's cached — otherwise it would dominate the
      # runtime of an otherwise six-minute job.
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      # Non-fatal: only 5 of 381 boards need a browser, and the adapter returns
      # empty rather than throwing when Playwright is missing. A bad install
      # should never cost you the other 376.
      #
      # Retry + a per-attempt timeout matter here specifically: continue-on-error
      # only catches a step that *fails*, not one that hangs. Run #133
      # (2026-08-17) stalled mid-`apt-get update` — the log shows a dead TCP
      # connection to an Ubuntu mirror, no error, just silence — and sat there
      # for the full 6-hour default job timeout, skipping every step after it
      # (including the hunt itself) and backing up the concurrency queue for
      # hours behind it. Every other run of this step finishes in 1-5 seconds,
      # so this reads as a one-off network stall rather than a real fault:
      # worth retrying instead of giving up on the first attempt.
      - name: Install Chromium
        continue-on-error: true
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: npx playwright install --with-deps chromium

      - id: hunt
        run: npm run hunt
        env:
          TEST_EMAIL: ${{ inputs.test_email && '1' || '0' }}

      - name: Save seen state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state/seen.json
          key: seen-${{ github.run_id }}

      - name: Save outage state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state/outage.json
          key: outage-${{ github.run_id }}

      # Silent self-healing (outage.ts withholds eviction) was the whole fix for
      # boards vanishing under a platform-wide block, but nothing told anyone it
      # had happened. This is the other half: one tracking issue per platform,
      # opened when it first looks like an outage and closed when it clears —
      # not a comment every 20 minutes for as long as the outage lasts, since
      # `outage_started`/`outage_recovered` only fire on the actual transition.
      - name: Report suspected ATS outage
        if: "!inputs.test_email && (steps.hunt.outputs.outage_started != '' || steps.hunt.outputs.outage_recovered == '1')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STARTED: ${{ steps.hunt.outputs.outage_started }}
          RECOVERED: ${{ steps.hunt.outputs.outage_recovered }}
        run: |
          if [ -n "$STARTED" ]; then
            for ats in ${STARTED//,/ }; do
              existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label outage --state open \
                --search "in:title $ats" --json number --jq '.[0].number')
              if [ -z "$existing" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" \
                  --title "Suspected outage: $ats" --label outage \
                  --body "Most $ats boards failed in the same run — see \`outage.ts\`. Boards are not being evicted while this holds; this issue closes itself automatically once the run stops seeing it. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              fi
            done
          fi
          if [ "$RECOVERED" = "1" ]; then
            for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --label outage --state open --json number --jq '.[].number'); do
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Cleared — the run no longer sees most of this platform's boards failing."
            done
          fi

      - name: Email new roles
        if: steps.hunt.outputs.new_count != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Job Alerts <${{ secrets.GMAIL_USER }}>
          to: ${{ secrets.ALERT_TO }}
          subject: '[jobs] ${{ steps.hunt.outputs.subject }}'
          html_body: file://out/email.html

      # The runner checked out `main` at queue time, so any push landing during
      # the run leaves it behind and the commit below is rejected. That is not
      # hypothetical: it failed twice, and because a failed step skips the rest
      # of the job it also took the catalog publish with it.
      - name: Rebase onto any commits that landed mid-run
        if: '!inputs.test_email'
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase --autostash origin main

      # companies.json is hand-curated, so its history is worth keeping on main.
      #
      # continue-on-error because this is bookkeeping, not the product: losing
      # one board-list commit costs nothing (the next run rewrites the same
      # state), while failing the job here skips "Publish catalog" and leaves
      # the data branch stale. It matters more since boards became tiered —
      # `lastPolledAt` lives in this file, and if it never persists the cold
      # rotation freezes on the same slice and never reaches the rest.
      - name: Commit board list
        if: '!inputs.test_email'
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'companies: board list update [skip ci]'
          file_pattern: companies.json

      # The catalogue is DERIVED data — regenerable from the boards at any time,
      # so its history has no value. Keeping it on main would add a fresh copy to
      # git 24 times a day, forever. Instead it lives on an orphan `data` branch
      # that is force-pushed as a single commit, so it never accumulates history.
      #
      # state/seen.json isn't published at all: at ~150,000 live postings it is
      # ~9.5 MB. It lives in the Actions cache, and if that is ever evicted the
      # run seeds itself from this catalogue and stays silent for one cycle.
      - name: Publish catalog to data branch
        if: '!inputs.test_email'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish=$(mktemp -d)
          cp data/jobs.json "$publish/jobs.json"
          cd "$publish"
          git init -q
          git checkout -qb data
          git add jobs.json
          git -c user.name='github-actions[bot]'               -c user.email='github-actions[bot]@users.noreply.github.com'               commit -qm "catalog: ${{ steps.hunt.outputs.new_count }} new"
          git push -qf "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" data
