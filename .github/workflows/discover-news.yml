name: discover-news

on:
  schedule:
    # Twice daily, 12h apart. Feeds expose only the most recent ~20-50 items
    # each; a single daily pull can miss items pushed off that window during
    # high-volume news days (Entrackr/Inc42 alone post dozens/day). 25 17 covers
    # the second half of the day the 25 5 run can't see yet.
    - cron: '25 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-news
  cancel-in-progress: false

jobs:
  discover-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - id: discover-news
        run: npm run discover-news

      # This run's own companies.json write is local and uncommitted at this
      # point, and hunt.yml pushes board-list updates on almost every
      # 20-minute run — a real chance to collide, since this job's own budget
      # is up to 30 minutes. hunt.yml hit exactly this race twice before
      # adding the same fix; --autostash carries this run's uncommitted
      # write through the rebase rather than losing it.
      - name: Rebase onto any commits that landed mid-run
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase --autostash origin main

      # Most days this changes nothing — a run that finds no new board with an
      # India role is the normal outcome, not a failure. git-auto-commit is a
      # no-op when the file is unchanged.
      - name: Commit new boards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'discover: new boards from funding news [skip ci]'
          file_pattern: companies.json

      # Separate from hunt.yml's job-alert email — this is a raw, unverified
      # candidate-name digest ("these companies were in funding/expansion news
      # today, go find their HR contact yourself"), not a claim any of them
      # have a real job board. Same SMTP secrets as hunt.yml; different content.
      - name: Email candidate digest
        if: steps.discover-news.outputs.candidate_count != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Job Alerts <${{ secrets.GMAIL_USER }}>
          to: ${{ secrets.ALERT_TO }}
          subject: '[discover-news] ${{ steps.discover-news.outputs.candidate_count }} candidates, ${{ steps.discover-news.outputs.kept_count }} boards confirmed'
          html_body: file://out/discover-news.html
